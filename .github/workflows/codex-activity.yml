name: Codex Activity

on:
  push:
    branches: ["main"]
    paths:
      - 'data/codex/usage.json'
      - '.github/workflows/codex-activity.yml'
  schedule:
    - cron: '17 0 * * *'
      timezone: "Asia/Singapore"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    uses: Lancasteerr/my-codex-activity/.github/workflows/render.yml@0d9b710150c738fe8707c600f56e13f364164ace
    with:
      tool_ref: '0d9b710150c738fe8707c600f56e13f364164ace'
      timezone: "Asia/Singapore"
      theme: github-dark
