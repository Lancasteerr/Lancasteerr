name: Codex Activity

on:
  push:
    branches: ["main"]
    paths:
      - 'data/codex/usage.json'
      - 'data/codex/config.json'
      - '.github/workflows/codex-activity.yml'
  schedule:
    - cron: '17 0 * * *'
      timezone: "Asia/Singapore"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: codex-activity-${{ github.repository }}
  cancel-in-progress: false

jobs:
  render:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Lancasteerr/my-codex-activity@main
        with:
          timezone: "Asia/Singapore"

