name: Codex Activity

on:
  push:
    branches: ["main"]
    paths:
      - 'data/codex/usage.json'
      - '.github/workflows/codex-activity.yml'
  schedule:
    - cron: '17 0 * * *'
      timezone: "Asia/Singapore"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    uses: Lancasteerr/my-codex-activity/.github/workflows/render.yml@4b3c8a51580e999c2aa2adb49e7179f4f8e493d8
    with:
      tool_ref: '4b3c8a51580e999c2aa2adb49e7179f4f8e493d8'
      timezone: "Asia/Singapore"
      theme: github-dark
