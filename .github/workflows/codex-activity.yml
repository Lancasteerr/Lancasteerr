name: Codex Activity

on:
  push:
    branches: ["main"]
    paths:
      - 'data/codex/usage.json'
      - 'data/codex/config.json'
      - '.github/workflows/codex-activity.yml'
  schedule:
    - cron: '17 0 * * *'
      timezone: "Asia/Singapore"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    uses: Lancasteerr/my-codex-activity/.github/workflows/render.yml@7078d7fb0338e3e00a62e25c143d0e9edcc7e272
    with:
      tool_ref: '7078d7fb0338e3e00a62e25c143d0e9edcc7e272'
      timezone: "Asia/Singapore"
      theme: github-dark
